name: Xiaohu theme releases

on:
  push:
    tags:
      - "xiaohu-v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test suite lifecycle and individual component switches
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace php:8.3-cli sh -c \
            'php tests/xiaohu_theme_suite.php && php -l app/Plugin/XiaohuTheme/Service/Suite.php && php -l app/Plugin/XiaohuTheme/Hook/Main.php && php -l app/Plugin/XiaohuTheme/Config/Submit.php && php -l app/Plugin/XiaohuTheme/Config/Config.php'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate tag and build update package
        id: package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#xiaohu-v}"
          [[ "$tag" == "xiaohu-v$version" ]]
          git fetch origin xiaohu
          git merge-base --is-ancestor "$GITHUB_SHA" origin/xiaohu
          python scripts/build-xiaohu-release.py --version "$version" --output-dir "$RUNNER_TEMP/xiaohu-release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/xiaohu-release/XiaohuTheme-${{ steps.package.outputs.version }}.zip"
          manifest="$RUNNER_TEMP/xiaohu-release/xiaohu-update.json"
          tag="$GITHUB_REF_NAME"
          title="Xiaohu v${{ steps.package.outputs.version }}"
          notes="小虎主题与配套插件更新包。后台在通用插件中检查并安装此 Release。"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" "$manifest" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" "$archive" "$manifest" \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes"
          fi
          published_tag="$(gh release view "$tag" --json tagName --jq .tagName)"
          if [[ "$published_tag" != "$tag" ]]; then
            echo "Release tag mismatch: expected $tag, got $published_tag" >&2
            exit 1
          fi
