#{include file=$adminHeader}
<div class="content d-flex flex-column flex-column-fluid" id="kt_content">
    #{include file=$adminToolbar}
    <div class="post d-flex flex-column-fluid" id="kt_post">
        <div id="kt_content_container" class="container-fluid">
            <div class="card mb-5 mb-xl-8">
                <div class="card-header border-0 pt-5">
                    <div class="card-title d-flex flex-column">
                        <span class="card-label fw-bold fs-3 mb-1">页面管理</span>
                        <span class="text-muted fw-semibold fs-7">管理站内博客首页和统一文章详情页。博客首页的四个区块、轮播节奏与分类入口都在这里配置。</span>
                    </div>
                    <div class="card-toolbar gap-2">
                        <a class="btn btn-sm btn-light-primary" href="/blog" target="_blank" rel="noopener">打开站内博客</a>
                        #{if $docsUrl}
                        <a class="btn btn-sm btn-light" href="#{$docsUrl}" target="_blank" rel="noopener">打开 Mintlify</a>
                        #{/if}
                    </div>
                </div>
                <div class="card-body py-5">
                    <div class="row g-5" id="template-list"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    .cc-home-section-card {
        overflow: hidden;
        background: #fff;
        transition: background-color .2s ease, border-color .2s ease, opacity .2s ease;
    }
    .cc-home-section-card.is-disabled {
        background: #f2f3f5;
        border-color: #d8dbe0 !important;
    }
    .cc-home-section-card.is-disabled .cc-home-section-body {
        opacity: .42;
        filter: grayscale(1);
        pointer-events: none;
        user-select: none;
    }
    .cc-home-section-card .form-check-input:not(:checked) {
        background-color: #c8cbd1 !important;
        border-color: #c8cbd1 !important;
    }
    .cc-home-section-body {
        transition: opacity .2s ease, filter .2s ease;
    }
</style>
<script>window.ContentCenterTemplates = { docsUrl: '#{$docsUrl}' };</script>
#{ready('/app/Plugin/ContentCenter/Assets/content-center-templates.js?v=20260726')}
#{include file=$adminFooter}
