#{include file=$adminHeader}
<style>
    .cc-cover-uploader {
        display: grid;
        grid-template-columns: minmax(210px, 260px) minmax(0, 1fr);
        gap: 16px;
        padding: 16px;
        border: 1px solid var(--bs-gray-300);
        border-radius: 8px;
        background: var(--bs-gray-100);
    }
    .cc-cover-preview {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border: 1px dashed var(--bs-gray-400);
        border-radius: 6px;
        background: var(--bs-body-bg);
    }
    .cc-cover-preview.has-error { border-color: var(--bs-danger); }
    .cc-cover-preview img { width: 100%; height: 100%; object-fit: cover; }
    .cc-cover-empty {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        color: var(--bs-gray-600);
        text-align: center;
    }
    .cc-cover-empty i { font-size: 28px; }
    .cc-cover-controls { min-width: 0; align-self: center; }
    #content-table .cc-sort-cell { width: 42px; text-align: center; }
    .cc-drag-handle {
        display: inline-flex;
        width: 32px;
        height: 32px;
        align-items: center;
        justify-content: center;
        color: var(--bs-gray-600);
        background: transparent;
        border: 0;
        border-radius: 7px;
        cursor: grab;
        touch-action: none;
    }
    .cc-drag-handle:hover { color: var(--bs-primary); background: var(--bs-primary-light); }
    .cc-drag-handle:active { cursor: grabbing; }
    #content-table tr.is-dragging { opacity: .38; }
    #content-table tr.is-sorting { background: var(--bs-primary-light); }
    #content-table tbody tr[data-id] { transition: background-color .16s ease, opacity .16s ease; }
    @media (max-width: 640px) {
        .cc-cover-uploader { grid-template-columns: 1fr; }
        .cc-cover-preview { max-width: none; }
    }
</style>
<div class="content d-flex flex-column flex-column-fluid" id="kt_content">
    #{include file=$adminToolbar}
    <div class="post d-flex flex-column-fluid" id="kt_post">
        <div id="kt_content_container" class="container-fluid">
            <div class="card mb-5 mb-xl-8">
                <div class="card-header border-0 pt-5">
                    <div class="card-title d-flex flex-column">
                        <span class="card-label fw-bold fs-3 mb-1">#{$title}</span>
                        <span class="text-muted fw-semibold fs-7">在这里新增、编辑和发布所有文章；按住列表左侧手柄拖动，可调整前台和 Mintlify 的文章展示顺序。</span>
                    </div>
                    <div class="card-toolbar gap-2">
                        <a class="btn btn-sm btn-light-primary" href="/blog" target="_blank" rel="noopener">打开站内博客</a>
                        #{if $docsUrl}
                        <a class="btn btn-sm btn-light" href="#{$docsUrl}" target="_blank" rel="noopener">打开 Mintlify</a>
                        #{/if}
                        <button class="btn btn-sm btn-primary" id="content-create">新建文章</button>
                    </div>
                </div>
                <div class="card-body py-3">
                    <div class="d-flex gap-2 mb-5">
                        <input class="form-control form-control-sm w-250px" id="content-keyword" placeholder="搜索标题或 slug">
                        <select class="form-select form-select-sm w-150px" id="content-status">
                            <option value="">全部状态</option>
                            <option value="draft">草稿</option>
                            <option value="published">已发布</option>
                            <option value="failed">发布失败</option>
                        </select>
                        <button class="btn btn-sm btn-light" id="content-search">搜索</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle table-row-dashed fs-6 gy-4" id="content-table">
                            <thead><tr class="text-start text-muted fw-bold fs-7 text-uppercase gs-0"><th class="cc-sort-cell" title="拖动排序"><i class="fa-duotone fa-regular fa-grip-dots-vertical"></i></th><th>标题</th><th>Slug</th><th>状态</th><th>最后更新</th><th class="text-end">操作</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div class="text-muted fs-7 mt-3" id="content-total"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>window.ContentCenter = { type: '#{$contentType}', docsUrl: '#{$docsUrl}' };</script>
#{ready('/app/Plugin/ContentCenter/Assets/content-center.js?v=20260726')}
#{include file=$adminFooter}
