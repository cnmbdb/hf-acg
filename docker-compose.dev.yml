services:
  app:
    command:
      - sh
      - -c
      - |
        grep -q '^Listen 8080$$' /etc/apache2/ports.conf || printf '%s\n' 'Listen 8080' >> /etc/apache2/ports.conf
        sed -ri 's/<VirtualHost \*:80>/<VirtualHost *:80 *:8080>/' /etc/apache2/sites-available/000-default.conf
        apache2-foreground
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/acg-faka.ini:ro
